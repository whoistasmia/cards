
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Card Design</title>

    <link rel="stylesheet" href="style5.css">
</head>
<body>

<div class="container">

    <!-- Front Card Form -->

    <div class="card-box">

        <div class="credit-card front">

            <div class="card-top">
                <span class="chip">▦</span>
                <h3>VISA</h3>
            </div>

            <div class="card-number">
                1234 &nbsp; 5678 &nbsp; 9012 &nbsp; 3456
            </div>

            <div class="card-details">
                <div>
                    <span>Card Holder</span>
                    <h5>YOUR NAME</h5>
                </div>

                <div>
                    <span>Expires</span>
                    <h5>07/30</h5>
                </div>
            </div>

        </div>

        <form>

            <label>Card Number:</label>
            <input type="text" placeholder="Enter card number">

            <label>Card Holder:</label>
            <input type="text" placeholder="Enter card holder name">

            <div class="input-row">

                <div>
                    <label>Expires On:</label>
                    <input type="month">
                </div>

                <div>
                    <label>CVV:</label>
                    <input type="text" placeholder="CVV">
                </div>

            </div>

        </form>

    </div>


    <!-- Back Card Form -->

    <div class="card-box">

        <div class="credit-card back">

            <div class="black-strip"></div>

            <div class="cvv">
                <span>CVV</span>
                <div>•••</div>
            </div>

            <h3>VISA</h3>

        </div>

        <form>

            <label>Card Number:</label>
            <input type="text" placeholder="Enter card number">

            <label>Card Holder:</label>
            <input type="text" placeholder="Enter card holder name">

            <div class="input-row">

                <div>
                    <label>Expires On:</label>
                    <input type="month">
                </div>

                <div>
                    <label>CVV:</label>
                    <input type="text" placeholder="CVV">
                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
