
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Layered Effect</title>

    <link rel="stylesheet" href="style3.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

    <h2>CARD LAYERED EFFECT</h2>

    <div class="container">

        <!-- Card 1 -->
        <div class="card">
            <span>LAYOUT EFFECT</span>

            <h3>
                YOU ARE<br>
                THE <b>FLOW</b><br>
                TO MY<br>
                <b>LAYOUT</b>
            </h3>

            <i class="fa-solid fa-heart"></i>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <span>LAYOUT EFFECT</span>

            <h3>
                YOU ARE<br>
                THE<br>
                <b>ANIMATION</b><br>
                TO MY<br>
                <b>WEBSITE</b>
            </h3>

            <i class="fa-solid fa-heart"></i>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <span>LAYOUT EFFECT</span>

            <h3>
                YOU ADD<br>
                THE <b>BOX-</b><br>
                <b>SHADOW</b><br>
                TO MY <b>WEB!</b>
            </h3>

            <i class="fa-solid fa-heart"></i>
        </div>

    </div>

</body>
</html>
